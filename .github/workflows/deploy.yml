name: Build and Deploy to hoster.by

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка (npm run build)
        run: npm run build

      - name: Заливка dist/ на hoster.by по SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.FTP_USERNAME }}
          server: ${{ secrets.FTP_SERVER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: '/var/www/h217789/data/www/xn--80abmaqkfkkhm5a4b1k.xn--90ais/'
          sftp_only: true
          sftpArgs: '-o StrictHostKeyChecking=no'