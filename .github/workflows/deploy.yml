name: Build and Deploy to hoster.by

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # В проекте есть bun.lock; npm ci требует package-lock.json.
      # Если его нет — ставим через npm install, чтобы сборка не падала.
      - name: Установка зависимостей
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Сборка (npm run build)
        run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID }}

      # Не заливаем на хостинг сломанную сборку: если пререндер не отработал,
      # деплой остановится здесь, а старая версия сайта останется на месте.
      - name: Проверка результата пререндера
        run: |
          test -f dist/index.html
          test -f dist/spa.html
          test -f dist/sitemap.xml
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/about/index.html
          grep -q 'rel="canonical" href="https://xn--80abmaqkfkkhm5a4b1k.xn--90ais/about/"' dist/about/index.html

      - name: Заливка dist/ на hoster.by через rsync (только изменения)
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass rsync
          sshpass -e rsync -az --checksum --partial \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            ./dist/ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/var/www/h217789/data/www/xn--80abmaqkfkkhm5a4b1k.xn--90ais/