name: Build and Deploy to hoster.by

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка (npm run build)
        run: npm run build

      - name: Заливка dist/ на hoster.by по SFTP
        uses: pressbooks/sftp-deploy@v1
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          local_path: './dist/*'
          remote_path: '/www/xn--80abmaqkfkhm5a4b1k.xn--90ais/'
          sftpArgs: '-o StrictHostKeyChecking=no'